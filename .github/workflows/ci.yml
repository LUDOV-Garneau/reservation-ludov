# Contrôles partagés par pr.yml et deploy.yml. Les deux workflows avaient
# jusqu'ici une copie du même job, qui finissait forcément par diverger.
name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualite:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # Pas de `npm run build` ici : le job « image » ci-dessous lance le vrai
      # build Next dans l'image Docker, qui fait aussi la vérification de
      # types. Les deux jobs tournent en parallèle, on ne compile donc pas
      # l'application deux fois.
      # `npx tsc --noEmit` n'est pas utilisable en l'état : il remonte 58
      # erreurs préexistantes dans les fichiers .test.ts depuis la migration
      # Drizzle, que `next build` ne voit pas.
      - name: Tests
        run: npm run test

  image:
    name: Image Docker & démarrage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Le job « qualité » valide le code sur un runner Ubuntu avec toutes les
      # dépendances : il ne prouve rien sur l'image que Coolify va réellement
      # construire. Sans ce job, une PR qui casse le Dockerfile passe le CI et
      # n'échoue qu'au déploiement.
      # Pas de build-arg : le Dockerfile fixe lui-même un JWT_SECRET factice
      # pour le build, le vrai secret étant injecté au runtime par Coolify.
      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ludov:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test de fumée : la seule vérification qui prouve que bcrypt se charge
      # sur musl, que Next écoute bien sur 0.0.0.0 et que l'image démarre.
      - name: Démarrage de l'image et sonde /api/health
        run: |
          set -euo pipefail

          docker run -d --name ludov-ci -p 3000:3000 \
            -e JWT_SECRET=smoke-test-only \
            ludov:ci

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              ok=1
              break
            fi
            sleep 2
          done

          echo ""
          echo "--- logs du conteneur ---"
          docker logs ludov-ci

          if [ "$ok" -ne 1 ]; then
            echo "::error::L'image ne répond pas sur /api/health après 60 s"
            exit 1
          fi

          echo "L'image démarre et répond correctement."

      - name: Nettoyage
        if: always()
        run: docker rm -f ludov-ci || true
